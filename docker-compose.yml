# Local stack: web (Caddy serving the built SPA + proxying /api) · api · worker · postgres.
# Host ports are overridable to avoid clashes with other local projects.
name: dictation

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://dictation:${POSTGRES_PASSWORD:-dictation}@postgres:5432/dictation
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  # Local S3 (minio). Production points these at Cloudflare R2 via .env.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-dictation-audio}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dictation}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dictation-dev-secret}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9010/dictation-audio}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dictation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dictation}
      POSTGRES_DB: dictation
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432" # loopback only: dev password is not secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictation -d dictation"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dictation}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dictation-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9010}:9000" # browser fetches audio from here
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the audio bucket and allow anonymous reads (audio URLs are public, keys are UUIDs).
  minio-init:
    image: minio/minio:latest # bundles the mc client
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${BUCKET}
      && mc anonymous set download local/$${BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dictation}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dictation-dev-secret}
      BUCKET: ${S3_BUCKET:-dictation-audio}

  api:
    build: { context: ./api, target: api }
    environment: *app-env
    env_file: [{ path: .env, required: false }]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: { context: ./api, target: worker }
    environment: *app-env
    env_file: [{ path: .env, required: false }]
    depends_on:
      api: { condition: service_healthy } # api runs migrations on start

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
